name: Update song dashboard

on:
  schedule:
    - cron: '0 12 * * 1'   # Mondays at 12:00 UTC (6–7 am Central, 7–8 am Eastern)
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['public/template.html', 'scripts/**', 'data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: song-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull new services from Planning Center
        if: github.event_name != 'push'
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
        run: node scripts/update-from-pco.mjs

      - name: Build the page
        run: node scripts/build.mjs

      - name: Save the new data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/index.html
          git diff --cached --quiet || (git commit -m "Song update $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
